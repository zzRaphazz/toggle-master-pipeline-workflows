name: Reusable Terraform validation

on:
  workflow_call:
    inputs:
      mode:
        description: Validate a single infrastructure root or all top-level modules.
        required: false
        default: root
        type: string
      terraform_version:
        description: Terraform CLI version.
        required: false
        default: 1.9.8
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Format and validate Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false

      - name: Validate requested mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" != "root" ] && [ "$MODE" != "modules" ]; then
            echo "::error::Unsupported Terraform validation mode: $MODE"
            exit 1
          fi

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize and validate infrastructure root
        if: inputs.mode == 'root'
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Initialize and validate Terraform modules
        if: inputs.mode == 'modules'
        shell: bash
        run: |
          found=0
          for module_dir in */; do
            [ -d "$module_dir" ] || continue
            [ -f "${module_dir}main.tf" ] || continue
            found=1
            terraform -chdir="$module_dir" init -backend=false -input=false
            terraform -chdir="$module_dir" validate
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No top-level Terraform modules were found."
            exit 1
          fi
