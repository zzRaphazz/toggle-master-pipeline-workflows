name: Reusable service CI

on:
  workflow_call:
    inputs:
      service:
        description: ECR service suffix, for example auth-service.
        required: true
        type: string
      language:
        description: Service implementation language (go or python).
        required: true
        type: string
      sonar_organization:
        description: SonarCloud organization.
        required: false
        default: ""
        type: string
      sonar_project_key:
        description: SonarCloud project key.
        required: false
        default: ""
        type: string
      gitops_repository:
        description: Owner/repository containing the deployment manifests.
        required: true
        type: string
      gitops_file:
        description: Manifest path relative to the GitOps repository root.
        required: true
        type: string
      aws_region:
        description: AWS region containing the ECR repository.
        required: false
        default: us-east-1
        type: string
    secrets:
      AWS_ROLE_ARN:
        required: false
      SONAR_TOKEN:
        required: false
      GITOPS_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  ci:
    name: Validate ${{ inputs.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      IMAGE_TAG: sha-${{ github.sha }}
      LOCAL_IMAGE: togglemaster-${{ inputs.service }}:sha-${{ github.sha }}
      AWS_REGION: ${{ inputs.aws_region }}
    steps:
      - name: Check out service repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        if: inputs.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download Go dependencies
        if: inputs.language == 'go'
        run: go mod download

      - name: Test Go service
        if: inputs.language == 'go'
        run: go test ./...

      - name: Lint Go service
        if: inputs.language == 'go'
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8

      - name: Run Go security analysis
        if: inputs.language == 'go'
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.2
          "$(go env GOPATH)/bin/gosec" -severity medium -confidence medium ./...

      - name: Set up Python
        if: inputs.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile and test Python service
        if: inputs.language == 'python'
        run: |
          python -m compileall -q .
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            python -m pip install --requirement requirements.txt pytest
            python -m pytest
          else
            echo "No Python unit tests found; source compilation passed."
          fi

      - name: Install Python lint and security tools
        if: inputs.language == 'python'
        run: python -m pip install ruff==0.9.6 bandit==1.8.3

      - name: Lint Python service
        if: inputs.language == 'python'
        run: ruff check .

      - name: Run Python security analysis
        if: inputs.language == 'python'
        run: bandit -r . -ll -ii

      - name: Validate SonarCloud configuration
        env:
          SONAR_ORGANIZATION: ${{ inputs.sonar_organization }}
          SONAR_PROJECT_KEY: ${{ inputs.sonar_project_key }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_ORGANIZATION" ] || [ -z "$SONAR_PROJECT_KEY" ] || [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Configure SonarCloud organization/project variables and SONAR_TOKEN."
            exit 1
          fi

      - name: Scan with SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ inputs.sonar_organization }}
            -Dsonar.projectKey=${{ inputs.sonar_project_key }}
            -Dsonar.qualitygate.wait=true

      - name: Scan filesystem dependencies
        uses: zzRaphazz/toggle-master-pipeline-actions/.github/actions/trivy-fs@v1.0.1

      - name: Build and scan image
        uses: zzRaphazz/toggle-master-pipeline-actions/.github/actions/docker-build-scan@v1.0.1
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}

      - name: Save validated image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "$LOCAL_IMAGE" --output image.tar

      - name: Upload validated image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ inputs.service }}-${{ github.sha }}
          path: image.tar
          retention-days: 1

  publish:
    name: Publish image to ECR
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.publish-image.outputs.image }}
    env:
      IMAGE_TAG: sha-${{ github.sha }}
      LOCAL_IMAGE: togglemaster-${{ inputs.service }}:sha-${{ github.sha }}
    steps:
      - name: Download validated image
        uses: actions/download-artifact@v4
        with:
          name: image-${{ inputs.service }}-${{ github.sha }}

      - name: Load validated image
        run: docker load --input image.tar

      - name: Validate AWS role configuration
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::Configure AWS_ROLE_ARN to publish to ECR through OIDC."
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push immutable image
        id: publish-image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: toggle-master-${{ inputs.service }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker tag "$LOCAL_IMAGE" "$IMAGE"
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  update-gitops:
    name: Update deployment image
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gitops_repository }}
          ref: main
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Validate and update image reference
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          MANIFEST: gitops/${{ inputs.gitops_file }}
        run: |
          if [ -z "$IMAGE" ] || [ ! -f "$MANIFEST" ]; then
            echo "::error::Published image or target manifest is missing."
            exit 1
          fi
          sed -i -E "s|^([[:space:]]*image: ).*|\\1$IMAGE|" "$MANIFEST"

      - name: Commit and push GitOps update
        env:
          SERVICE: ${{ inputs.service }}
        working-directory: gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.gitops_file }}"
          if git diff --cached --quiet; then
            echo "The manifest already references this image."
            exit 0
          fi
          git commit -m "chore(gitops): update $SERVICE image"
          git pull --rebase origin main
          git push origin HEAD:main
